[project]
name = "dosemem_eval"
version = "0.1.0"
description = "Blind, equal-budget evaluation kit for agent memory layers (dosemem benchmark protocol)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# Third-party memory systems are optional and imported lazily. Their code is
# never vendored; install the extra only if you want to evaluate that system.
openviking = ["openviking-sdk>=0.1.17"]
mem0 = ["mem0ai>=2.2.1"]

[project.scripts]
dosemem-eval = "dosemem_eval.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dosemem_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
